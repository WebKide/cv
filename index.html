  <!-- Onsen UI JS runtime only — still needed for ons-page/ons-toolbar/
       ons-list-item/etc. custom elements and ons.notification.* dialogs.
       Its CSS bundle and the old safe-area patch file are now folded
       into styles.css and are no longer linked here. -->
  <script src="js/dependencies/offline-onsenui.min.js"></script>

  <!-- New: SPA page-stack layout (replaces what ons-navigator used to handle) -->
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <script>
  if ('serviceWorker' in navigator) {

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // Reload once when a service worker takes control.
      window.location.reload();
    });

    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data?.type === 'SW_INSTALL_FAILED') {
        console.error('SW install failed:', event.data.error);
        alert('Esta aplicación no se ha podido instalar correctamente para usar sin connexión (' + event.data.error + '). Por favor instalar nuevamente, es posible que tengas que eliminar por completo antes de actualizar.');
      }
    });

    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('sw.js');
        console.log('SW registered:', registration.scope);
      } catch (err) {
        console.error('SW registration failed:', err);
      }
    });

  }
  </script>
</head>
